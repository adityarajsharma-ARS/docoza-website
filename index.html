<!DOCTYPE html>
<html>
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PDFSuite — a premium, privacy-first PDF toolkit. Every tool runs 100% locally in your browser. Your files never leave your device.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PDFSuite">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>PDFSuite — Local-first PDF tools</title>
  <link rel="manifest" href="manifest.json">

  <!--
    OCR PDF runs Tesseract.js (WebAssembly) fully client-side. It is loaded
    from a CDN at runtime but all recognition happens inside the user's
    browser sandbox — no file bytes are ever transmitted anywhere. Loaded
    lazily only when the OCR tool is opened (see ocr_service.dart).
  -->
  <script>
    window.__loadTesseract = function () {
      return new Promise(function (resolve, reject) {
        if (window.Tesseract) { resolve(); return; }
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = function () { resolve(); };
        s.onerror = reject;
        document.head.appendChild(s);
      });
    };
  </script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="js/pdf_organize_bridge.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
